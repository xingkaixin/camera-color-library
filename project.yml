name: ColorLibrary
options:
  bundleIdPrefix: studio.colorlibrary
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
packages:
  ColorKit:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  ColorLibrary:
    type: application
    platform: iOS
    sources: [ColorLibrary]
    dependencies:
      - package: ColorKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.colorlibrary.app
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 色彩手记
        INFOPLIST_KEY_NSCameraUsageDescription: 用摄像头捕捉眼前的颜色，照片和色卡只保存在你的设备上。
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 将你选择分享的色彩卡保存到系统照片图库。
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
  ColorLibraryTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ColorLibraryTests]
    dependencies:
      - target: ColorLibrary
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  ColorLibraryUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ColorLibraryUITests]
    dependencies:
      - target: ColorLibrary
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ColorLibrary:
    build:
      targets:
        ColorLibrary: all
    test:
      targets:
        - ColorLibraryTests
        - ColorLibraryUITests
